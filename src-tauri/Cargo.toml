[package]
name = "swallownote"
version = "0.1.0"
description = "A Markdown note-taking application"
authors = ["SwallowNote Team"]
edition = "2021"

[lib]
name = "swallownote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 发布体积优化：macOS dmg 为 universal 包内含 arm64+x64 两份二进制，
# 每份的瘦身都直接双倍反映到最终安装包体积
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-log = "2.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "8.2"
notify-debouncer-full = "0.7"
uuid = { version = "1.0", features = ["v4"] }
# 搜索遍历引擎（ripgrep 同款）：并行遍历 + gitignore + symlink 防护
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# 只启用 deflate：日志导出/插件打包全部使用 Deflated 压缩，
# 关闭默认的 xz/bzip2/zstd 可移除三套 C 压缩库（减体积且简化交叉编译）
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
futures = "0.3"
once_cell = "1"
base64 = "0.22"
chrono = "0.4"
aes-gcm = "0.10"
sha2 = "0.10"
jwalk = "0.8"
keyring = "3"
serde_yaml = "0.9"
similar = { version = "2", features = ["text"] }
thiserror = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
semver = "1"
libc = "0.2"
url = "2"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"
# macOS 用系统 Security.framework（native-tls），零体积成本且信任系统证书链
reqwest = { version = "0.12", features = ["json", "stream"] }

# TLS 按平台选择：Windows/Linux 用 rustls——Linux AppImage 会把 libssl 拷入包内、
# Windows CI 需从源码编译 OpenSSL（依赖 Perl），rustls 纯 Rust 实现同时消除这两个问题
[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Storage_FileSystem"] }
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
